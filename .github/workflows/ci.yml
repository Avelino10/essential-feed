name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  macos:
    name: EssentialFeed (macOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project EssentialFeed.xcodeproj \
            -scheme "CI_macOS" \
            -destination "platform=macOS" \
            -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

  ios:
    name: EssentialApp (iOS Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -workspace EssentialApp.xcworkspace \
            -scheme "CI_iOS" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=27.0" \
            -collect-test-diagnostics never \
            -skip-testing:EssentialFeediOSTests/FeedSnapshotTests \
            -skip-testing:EssentialFeediOSTests/ListSnapshotTests \
            -skip-testing:EssentialFeediOSTests/ImageCommentsSnapshotTests \
            -skip-testing:EssentialAppTests/FeedUIIntegrationTests/test_loadingFeedIndicator_isVisibleWhileLoadingFeed \
            -skip-testing:EssentialAppTests/CommentsUIIntegrationTests/test_loadingCommentsIndicator_isVisibleWhileLoadingComments \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES
