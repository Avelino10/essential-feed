name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  macos:
    name: EssentialFeedKit (macOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        working-directory: EssentialFeedKit
        run: |
          xcodebuild test \
            -scheme "EssentialFeed" \
            -destination "platform=macOS" \
            -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

  ios:
    name: iOS Simulator
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create iPhone 18 Pro simulator if missing
        run: |
          xcrun simctl list devices "iOS 27.0" | grep -q "iPhone 18 Pro (" ||
            xcrun simctl create "iPhone 18 Pro" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro \
              com.apple.CoreSimulator.SimRuntime.iOS-27-0

      - name: Test EssentialFeedKit
        working-directory: EssentialFeedKit
        run: |
          xcodebuild test \
            -scheme "EssentialFeedKit-Package" \
            -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0" \
            -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Test EssentialApp
        run: |
          xcodebuild test \
            -workspace EssentialApp.xcworkspace \
            -scheme "CI_iOS" \
            -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0" \
            -collect-test-diagnostics never \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES
