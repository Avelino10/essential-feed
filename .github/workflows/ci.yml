name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  macos:
    name: EssentialFeed (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild clean build test \
            -project EssentialFeed.xcodeproj \
            -scheme "CI_macOS" \
            -sdk macosx -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES

  ios:
    name: EssentialApp (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild clean build test \
            -workspace EssentialApp.xcworkspace \
            -scheme "CI_iOS" \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES
